# PostgreSQL for the go-sqlcx integration tests:
#   docker compose up -d --wait
#   SQLCX_DATABASE_URL=postgres://sqlcx:sqlcx@localhost:54329/sqlcx?sslmode=disable go test ./...
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sqlcx
      POSTGRES_PASSWORD: sqlcx
      POSTGRES_DB: sqlcx
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlcx -d sqlcx"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
